      <rect x="6" y="10" width="2" height="2" fill="#f59e0b" />
      <rect x="3" y="7" width="2" height="2" fill="#f59e0b" />
      <rect x="4" y="8" width="1" height="1" fill="#fbbf24" />
      <rect x="7" y="11" width="1" height="1" fill="#fbbf24" />
